# FraudShield AI — Render Deployment Configuration
# Single free-tier web service that runs Flask + simulator together.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fraudshield-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /

    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
